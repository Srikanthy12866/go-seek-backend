spring.application.name=go-seek-backend
server.port=${PORT:${APP_SERVER_PORT:8082}}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,*}

# Database 2 (app_db) - Hosted on TiDB Cloud Serverless (Free Tier)
spring.datasource.url=${APP_DB_URL:jdbc:mysql://gateway01.ap-northeast-1.prod.aws.tidbcloud.com:4000/app_db?sslMode=VERIFY_IDENTITY}
spring.datasource.username=${APP_DB_USERNAME:dkyd9BrrEMPi4wM.root}
spring.datasource.password=${APP_DB_PASSWORD:BbzWNAXRIX7kozmr}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# OpenFeign Client: Inter-Microservice URL for Auth Service
app.services.auth-url=${AUTH_SERVICE_URL:http://localhost:8081}

# Kafka Configuration for Event Handling
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:go-seek-backend-group}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

app.kafka.topics.user-registered=${KAFKA_USER_REGISTERED_TOPIC:user-registered-topic}
app.kafka.topics.ticket-created=${KAFKA_TICKET_CREATED_TOPIC:ticket-created-topic}

# Email Notification Configuration (Gmail SMTP)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:srikanthy12866@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Target inbox for Contact messages and Tickets
app.notification.recipient-email=${NOTIFICATION_EMAIL:srikanthy12866@gmail.com}

# JWT Shared Secret (Must match auth-service)
app.jwt.secret=${JWT_SECRET:dGhpc2lzYXNlY3VyZTI1NmJpdHNlY3JldGtleWZvcmF1dGh0b2tlbnMxMjM0NTY=}

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://srikanthy12866.github.io}

# Secure Resume Provider (Server-Side Proxy - no client-side exposure)
app.resume.file-path=${RESUME_FILE_PATH:}
app.resume.remote-url=${RESUME_REMOTE_URL:}

server.error.include-message=always
server.error.include-stacktrace=never
